<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Smart Spend – Automated expense and budget manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--sf:#fff;--ink:#1b1b3a;--mut:#6b6f8d;--ln:#e4e6f2;--ac:#6d4aff;--ac2:#efeaff;--gn:#0fa37f;--wn:#d98200;--dg:#e03a5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f1f;--sf:#181a30;--ink:#eceefb;--mut:#9a9fc4;--ln:#2a2d4a;--ac:#8b7bff;--ac2:#24224a;--gn:#35d0a5;--wn:#f0b04a;--dg:#ff7b95;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0f1f;--sf:#181a30;--ink:#eceefb;--mut:#9a9fc4;--ln:#2a2d4a;--ac:#8b7bff;--ac2:#24224a;--gn:#35d0a5;--wn:#f0b04a;--dg:#ff7b95;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:90px}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}.lg2{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:22px;background:linear-gradient(135deg,#6d4aff,#ec4899)}
h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.03em}h1 span{color:var(--ac)}h2{font-size:16px;font-weight:700;margin:0 0 12px}
select,input,button,textarea{font:inherit;color:inherit}
select,input,textarea{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;min-width:0}
textarea{width:100%;min-height:90px}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(109,74,255,.3)}
button.g{background:var(--sf);color:var(--ink);border:1px solid var(--ln);box-shadow:none}button.x{background:transparent;color:var(--dg);padding:4px 8px;box-shadow:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
nav{display:flex;gap:6px;margin:18px 0;background:var(--sf);padding:5px;border-radius:14px;border:1px solid var(--ln);width:fit-content}
nav button{background:none;color:var(--mut);padding:8px 16px;box-shadow:none;display:flex;gap:6px;align-items:center}nav button:hover{transform:none;box-shadow:none}
nav button.on{background:var(--ac);color:#fff}
.hero{border-radius:20px;padding:24px;color:#fff;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;background:linear-gradient(120deg,#4f46e5,#7c3aed 55%,#ec4899);box-shadow:0 14px 34px rgba(109,74,255,.3);margin-bottom:16px}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.1}.hk{opacity:.85;font-size:14px}
.pills{display:flex;gap:8px;flex-wrap:wrap}.pills span{background:rgba(255,255,255,.18);padding:7px 14px;border-radius:99px;font-weight:600;font-size:14px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px}
.st{position:relative}.st i{font-style:normal;font-size:20px;width:38px;height:38px;border-radius:11px;background:var(--ac2);display:grid;place-items:center;margin-bottom:8px}
.k{color:var(--mut);font-size:13px}.n{font-size:24px;font-weight:800;letter-spacing:-.02em}
.in{color:var(--gn)}.out{color:var(--dg)}
.donut{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut i{width:98px;height:98px;border-radius:50%;background:var(--sf);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:14px;text-align:center}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lg div{display:flex;gap:8px;align-items:center;font-size:13px;margin:3px 0}.lg b{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.al{padding:10px 12px;border-radius:12px;margin-bottom:8px;border-left:4px solid var(--ac);background:var(--ac2);font-size:14px}
.al.w{border-color:var(--wn)}.al.d{border-color:var(--dg)}.al.i{border-color:var(--ac)}
.li{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}.li:first-of-type{border-top:0}.li>div{flex:1;min-width:0}.li b{font-weight:600}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mut);font-weight:600;padding:6px}td{padding:8px 6px;border-top:1px solid var(--ln)}
.sc{overflow-x:auto;max-width:100%}tr.rv td:first-child{border-left:4px solid var(--wn)}
.f{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.f>*{flex:1 1 120px}
.tr{display:flex;align-items:flex-end;gap:10px;height:120px}.tr div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.tr i{display:block;background:linear-gradient(180deg,#8b5cf6,#6d4aff);border-radius:7px 7px 0 0;margin-bottom:4px}
.msg{margin-top:8px;font-size:14px;color:var(--mut)}.empty{text-align:center;padding:48px 16px}.em{font-size:48px}
.fab{position:fixed;right:18px;bottom:24px;width:54px;height:54px;border-radius:50%;font-size:26px;padding:0;z-index:30;background:linear-gradient(135deg,#6d4aff,#ec4899);box-shadow:0 10px 24px rgba(109,74,255,.45)}
@media(max-width:700px){nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin:0;width:auto;z-index:20;justify-content:space-around;box-shadow:0 10px 30px rgba(0,0,0,.18)}nav button{flex-direction:column;gap:0;padding:6px 10px;font-size:12px;background:none}nav button.on{background:var(--ac2);color:var(--ac)}.fab{bottom:96px}.big{font-size:36px}}
body.lo .wrap,body.lo .fab{display:none}
.av{width:36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700}
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;grid-template-columns:1fr 1fr;overflow:auto}
.ap{background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#ec4899);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.ah{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.1}.ap p{opacity:.9;max-width:380px;margin:0}
.af{display:grid;place-items:center;padding:24px}.afc{width:100%;max-width:380px}.afc input{width:100%;margin-bottom:10px}
@media(max-width:700px){#auth{grid-template-columns:1fr}.ap{padding:24px}.ah{font-size:26px}}
#ringer{position:fixed;inset:0;z-index:100;background:rgba(10,10,30,.65);place-items:center;padding:16px}
.rc{background:var(--sf);padding:28px;border-radius:20px;text-align:center;min-width:280px;max-width:400px}.rc .em{display:inline-block;animation:sh .4s infinite}
@keyframes sh{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@media(prefers-reduced-motion:reduce){.rc .em{animation:none}}
@media(max-width:700px){nav{overflow-x:auto}nav button{padding:6px 5px;font-size:10.5px;flex:1}}
.bd{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--ac2);color:var(--ac);white-space:nowrap}.bd.w{background:#fff1d6;color:#9a6200}.bd.d{background:#ffe0e6;color:#c0233f}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dh{text-align:center;color:var(--mut);font-size:12px;padding:4px}
.cd{min-height:68px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:5px 6px;text-align:left;color:var(--ink);font-weight:500;box-shadow:none;display:flex;flex-direction:column;gap:1px;font-size:13px;min-width:0;overflow:hidden}
.cd:hover{transform:none;box-shadow:none;border-color:var(--ac)}.cd.t{border-color:var(--ac);border-width:2px}.cd.s{background:var(--ac);color:#fff}.cd small{font-size:10px;line-height:1.2;opacity:.85}
.dots{display:flex;gap:3px;margin-top:auto}.dots i{width:6px;height:6px;border-radius:50%}
@media(max-width:700px){.cd small{display:none}.cd{min-height:46px;padding:4px}}

<script>
let K='';const S0=()=>({tx:[],rules:{},bud:{},rec:[],roll:false,acc:[],alarms:[],bills:[],ia:'',bw:{}});let S=S0();
const save=()=>{if(!K)return;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i),pad=n=>String(n).padStart(2,'0');
const CATS={Food:'#e07a3f',Transport:'#3b82c4',Rent:'#7c5cbf',Bills:'#c9a227',Shopping:'#d1568a',Health:'#2f9e6f',Entertainment:'#8a63d2',Savings:'#0f766e',Other:'#8b968f'};
const KW={Food:['swiggy','zomato','restaurant','cafe','dominos','bigbasket','zepto','blinkit','kitchen','bakery'],Transport:['uber','ola','rapido','metro','petrol','irctc','fuel','redbus','fastag'],Rent:['rent','landlord'],Bills:['jio','airtel','vodafone','electricity','bescom','broadband','water','gas','recharge'],Shopping:['amazon','flipkart','myntra','ajio','meesho','mall'],Health:['apollo','pharmacy','hospital','practo','clinic','medplus'],Entertainment:['netflix','spotify','hotstar','bookmyshow','prime','youtube'],Savings:['sip','mutual','zerodha','groww','ppf','deposit']};
const fmt=n=>(n<0?'-':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=new Date(),TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`,CUR=TODAY.slice(0,7);
let M=CUR,tab='Overview',flt='';
const T=['Overview','Transactions','Calendar','Accounts','Import','Budgets','Reminders'];const NI={Overview:'📊',Transactions:'🧾',Calendar:'📅',Accounts:'🏦',Import:'⚡',Budgets:'🎯',Reminders:'⏰'},CI={Food:'🍔',Transport:'🚕',Rent:'🏠',Bills:'💡',Shopping:'🛍️',Health:'💊',Entertainment:'🎬',Savings:'🏦',Other:'📦',Income:'💵'};
const pm=(m,d=-1)=>{const[y,mo]=m.split('-').map(Number),x=new Date(y,mo-1+d,1);return `${x.getFullYear()}-${pad(x.getMonth()+1)}`};
const key=m=>(String(m).toLowerCase().match(/[a-z]{3,}/)||[''])[0];
const col=c=>CATS[c]||'#8b968f';
function guess(m){const l=m.toLowerCase(),k=key(m);if(S.rules[k])return[S.rules[k],95];for(const c in KW)if(KW[c].some(w=>l.includes(w)))return[c,85];return['Other',30]}
function add(t){if(S.tx.some(x=>x.date==t.date&&x.amt==t.amt&&x.type==t.type&&x.m.toLowerCase()==t.m.toLowerCase()))return false;
 let c,cf;if(t.type=='in'){c='Income';cf=100}else if(t.cat){c=t.cat;cf=100}else[c,cf]=guess(t.m);
 S.tx.push({id:Math.random().toString(36).slice(2,9),date:t.date,amt:+t.amt,type:t.type,m:t.m,cat:c,conf:cf,acc:t.acc||((S.acc.find(a=>t.l4&&a.last4==t.l4)||{}).id)||S.ia||''});return true}
const mt=m=>S.tx.filter(t=>t.date.startsWith(m));
const sum=(a,ty)=>a.filter(t=>t.type==ty).reduce((s,t)=>s+t.amt,0);
function byCat(m){const o={};mt(m).filter(t=>t.type=='out').forEach(t=>o[t.cat]=(o[t.cat]||0)+t.amt);return o}

let WL=null;async function keepAwake(){try{WL=await navigator.wakeLock.request('screen');$('alr').textContent='Screen will stay on while this tab is open, so alarms can ring.'}catch(e){$('alr').textContent='This browser does not allow keeping the screen on. Keep the phone unlocked instead.'}}
const lz=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
function beep(f){try{if(!AC)unlock();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=.35;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.2)}catch(e){}}
function ring(a){if(cur)return;cur=a;document.title='⏰ '+a.t;$('rt2').textContent=a.t;$('ringer').style.display='grid';let n=0;const st=Date.now();beep(880);rtm=setInterval(()=>{if(Date.now()-st>=6e5){stopRing();return}beep(n++%2?880:660);try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}},500);
 try{if('Notification' in window&&Notification.permission=='granted')new Notification('Smart Spend reminder',{body:a.t})}catch(e){}}
function stopRing(){clearInterval(rtm);cur=null;document.title='Smart Spend – Automated expense and budget manager';$('ringer').style.display='none'}
function snooze(){const t=cur.t;stopRing();S.alarms.push({id:Date.now(),t:t+' (snoozed)',due:lz(new Date(Date.now()+600e3)),rep:'none',on:true});save();if(tab=='Reminders')render()}
function nxt(a){const d=new Date(a.due),st={daily:()=>d.setDate(d.getDate()+1),weekly:()=>d.setDate(d.getDate()+7),monthly:()=>d.setMonth(d.getMonth()+1)}[a.rep];if(!st){a.on=false;return}do st();while(d<=new Date());a.due=lz(d)}
function chk(){if(!K||cur)return;const a=S.alarms.find(x=>x.on&&new Date(x.due)<=new Date());if(a){nxt(a);save();if(tab=='Reminders')render();ring(a);return}
 const bl=S.bills.find(x=>dleft(x)<=x.before&&x.nf!=new Date().toDateString());if(bl){bl.nf=new Date().toDateString();save();if(tab=='Reminders'||tab=='Overview')render();ring({t:`${bl.t} ${dtxt(dleft(bl))}${bl.amt?', '+fmt(bl.amt):''}`});return}
 if(M==CUR){S.bw=S.bw||{};for(const c in CATS){const b=bf(c);if(b&&(byCat(CUR)[c]||0)>=b&&!S.bw[CUR+c]){S.bw[CUR+c]=1;save();ring({t:`${c} budget crossed (${fmt(byCat(CUR)[c])} of ${fmt(b)})`});return}
  const u=byCat(CUR)[c]||0;if(b&&u>=b*.9&&u<b&&!S.bw[CUR+c+'90']){S.bw[CUR+c+'90']=1;save();if(tab=='Overview')render();ring({t:`${c} budget is ${Math.round(u/b*100)}% used (${fmt(u)} of ${fmt(b)}). ${tips(c,CUR).slice(0,2).join(' ')}`});return}}}}
setInterval(chk,5000);
function addAl(){const t=$('rtl').value.trim(),d=$('rdt').value;if(!t||!d){$('alr').textContent='Enter a title and a date and time.';return}if(new Date(d)<=new Date()){$('alr').textContent='Pick a time in the future.';return}
 S.alarms.push({id:Date.now(),t,due:d,rep:$('rrp').value,on:true});save();render()}
function togAl(id,v){const a=S.alarms.find(x=>x.id==id);a.on=v;if(v&&new Date(a.due)<=new Date()&&a.rep=='none'){a.due=lz(new Date(Date.now()+60e3))}save();render()}
function delAl(id){S.alarms=S.alarms.filter(x=>x.id!=id);save();render()}
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.tagName=='INPUT'&&e.target.closest('#auth'))auth()});
updTheme();{const U=lsg('ss_users')||{},e=lsg('ss_session');if(e&&U[e])login(e);else authUI()}
</script></body></html>
